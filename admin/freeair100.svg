<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#0d1117"/>
  <!-- Unit housing -->
  <rect x="22" y="24" width="56" height="52" rx="7" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <!-- Heat exchanger core (cross-flow grid) -->
  <rect x="31" y="32" width="38" height="36" rx="3" fill="#161b22"/>
  <!-- Vertical lines (supply side - blue) -->
  <line x1="39" y1="32" x2="39" y2="68" stroke="#00b4d8" stroke-width="1.2" opacity="0.6"/>
  <line x1="47" y1="32" x2="47" y2="68" stroke="#00b4d8" stroke-width="1.2" opacity="0.6"/>
  <!-- Vertical lines (extract side - orange) -->
  <line x1="55" y1="32" x2="55" y2="68" stroke="#e67e22" stroke-width="1.2" opacity="0.6"/>
  <line x1="63" y1="32" x2="63" y2="68" stroke="#e67e22" stroke-width="1.2" opacity="0.6"/>
  <!-- Horizontal lines -->
  <line x1="31" y1="41" x2="69" y2="41" stroke="#30363d" stroke-width="0.8"/>
  <line x1="31" y1="50" x2="69" y2="50" stroke="#30363d" stroke-width="0.8"/>
  <line x1="31" y1="59" x2="69" y2="59" stroke="#30363d" stroke-width="0.8"/>

  <!-- Arrow: Outdoor air IN (left side, top, cyan) -->
  <line x1="4" y1="36" x2="21" y2="36" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="17,31 24,36 17,41" fill="#00b4d8"/>

  <!-- Arrow: Supply air OUT (right side, top, green) -->
  <line x1="69" y1="36" x2="88" y2="36" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="83,31 90,36 83,41" fill="#3fb950"/>

  <!-- Arrow: Extract air IN (right side, bottom, orange) -->
  <line x1="88" y1="64" x2="69" y2="64" stroke="#e67e22" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="73,59 66,64 73,69" fill="#e67e22"/>

  <!-- Arrow: Exhaust air OUT (left side, bottom, yellow) -->
  <line x1="21" y1="64" x2="4" y2="64" stroke="#e3b341" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="8,59 1,64 8,69" fill="#e3b341"/>

  <!-- Small label dots -->
  <circle cx="12" cy="30" r="3" fill="#00b4d8" opacity="0.7"/>
  <circle cx="88" cy="30" r="3" fill="#3fb950" opacity="0.7"/>
  <circle cx="88" cy="70" r="3" fill="#e67e22" opacity="0.7"/>
  <circle cx="12" cy="70" r="3" fill="#e3b341" opacity="0.7"/>
</svg>
